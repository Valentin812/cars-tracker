@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    mk("specs","Двигатель, коробка, привод",{type:"text"}),
    mk("comment","Комментарий",{},"textarea"));
  const dupBox=el("div",{className:"dup",role:"alert",hidden:true});
  const form=el("form",{className:"addf"},grid,el("div",{className:"row"},btn,msg),dupBox);
  form.onsubmit=async e=>{
    e.preventDefault();
    const v=k=>F[k].value.trim();
    const num=k=>{const n=parseInt(v(k).replace(/\s/g,""),10);return isNaN(n)?null:n};
    const u=v("url");
    if(!/^https?:\/\//.test(u)){msg.textContent="Вставьте ссылку, она должна начинаться с https://";return}
    let id=null,m;
    if((m=u.match(/drom\.ru\/.*?(\d{6,})\.html/)))id=m[1];
    else if((m=u.match(/auto\.ru\/.*?(\d{6,})/)))id="ar-"+m[1];
    else if((m=u.match(/avito\.ru\/.*?_(\d{6,})/))||(m=u.match(/avito\.ru\/.*?(\d{8,})/)))id="av-"+m[1];
    if(!id)id="m-"+Date.now();
    dupBox.replaceChildren();
    if(!form.dataset.force){
      const ds=findDups(id,u,num("year"),num("price"),num("km"));
      if(ds.length){
        msg.textContent="";
        dupBox.append(el("div",{},el("b",{},"Похоже, эта машина уже есть в списке:")));
        ds.forEach(r=>{
          const info=[r.title+(r.year?", "+r.year:""),fmtPrice(r.price),fmtKm(r.km),r.city,platform(r.url)].filter(Boolean).join(" · ");
          const acts=el("div",{className:"row"});
          const b1=el("button",{type:"button",className:"link"},"Показать карточку");b1.onclick=()=>showCar(r.id);acts.append(b1);
          if(r.status==="drop"){const b2=el("button",{type:"button",className:"link"},"Вернуть в работу");b2.onclick=async()=>{b2.disabled=true;if(u!==r.url)await save(r.id,{comment:((r.comment||"")+"\nТакже: "+u).trim()});await save(r.id,{status:"new"});showCar(r.id)};acts.append(b2)}
          if(u!==r.url&&!(r.comment||"").includes(u)){const b3=el("button",{type:"button",className:"link"},"Дописать ссылку в комментарий");b3.onclick=async()=>{b3.disabled=true;await save(r.id,{comment:((r.comment||"")+"\nТакже: "+u).trim()});showCar(r.id)};acts.append(b3)}
          dupBox.append(el("div",{},info+" — статус «"+stLabel(r.status)+"»"),acts);
        });
        if(!ds.some(r=>r.id===id)){const bf=el("button",{type:"button",className:"link"},"Это другая машина, всё равно добавить");bf.onclick=()=>{form.dataset.force="1";form.requestSubmit()};dupBox.append(el("div",{className:"row"},bf))}
        dupBox.hidden=false;return;
      }
    }
    delete form.dataset.force;dupBox.hidden=true;
    btn.disabled=true;msg.textContent="Сохраняю…";
    try{
      const res=await rpc("car_add",{p_id:id,p_grp:F.grp.value,p_title:v("title"),p_year:num("year"),p_price:num("price"),p_km:num("km"),p_specs:v("specs"),p_city:v("city"),p_distance:num("distance"),p_url:u,p_comment:F.comment.value.trim()});
      if(res==="exists"){msg.textContent="Такое объявление уже есть в списке";btn.disabled=false;return}
      addOpen=false;await load();
    }catch(err){msg.textContent="Не сохранилось: "+err.message;btn.disabled=false}
  };
  return form;
}
function filesBox(r){
  const box=el("div",{className:"files"});
  filesFor(r.id).forEach(f=>{const b=el("button",{className:"fbtn",type:"button"},"📎 "+f.name+" ("+fmtSize(f.size)+")");b.onclick=()=>openFile(f,b);box.append(b)});
  const inp=el("input",{type:"file",accept:".pdf,.jpg,.jpeg,.png,.webp"});
  inp.disabled=!canWrite;
  inp.onchange=()=>attach(r,inp);
  box.append(el("label",{className:"fadd"},"+ отчёт или фото",inp));
  return box;
}
async function openFile(f,btn){
  const old=btn.textContent;btn.textContent="Открываю…";
  try{
    const data=await rpc("car_file_get",{p_id:f.id});
    const bin=atob(data);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u],{type:f.mime}));
    const a=el("a",{href:url,download:f.name});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){alert("Не открылось: "+e.message)}
  btn.textContent=old;
}
async function attach(r,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>1500000){alert("Файл больше 1,5 МБ. Сожмите его или пришлите другой.");inp.value="";return}
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(f)});
  try{await rpc("car_file_add",{p_car:r.id,p_name:f.name,p_mime:f.type||"application/octet-stream",p_size:f.size,p_data:data});files=await rpc("car_files_all",{});render()}
  catch(e){alert("Не загрузилось: "+e.message);inp.value=""}
}
function card(r){
  const w=el("article",{id:"car-"+r.id,className:"car"+(isFresh(r)?" fr":"")+(r.status==="drop"?" drop":"")+(r.photo?" hasph":"")});const d=el("div",{className:"body"});if(r.photo){const im=el("img",{className:"ph",src:r.photo,loading:"lazy",alt:"",referrerPolicy:"no-referrer"});im.onerror=()=>{im.remove();w.classList.remove("hasph")};w.append(im)}w.append(d);
  const a=el("a",{className:"name",href:r.url,target:"_blank",rel:"noopener"},r.title+(r.year?", "+r.year:""));
  d.append(el("div",{className:"top"},a,el("span",{className:"price"},fmtPrice(r.price))));
  const meta=el("div",{className:"meta"});
  [fmtKm(r.km),r.specs,(r.city?r.city+(r.distance>0?" · "+r.distance.toLocaleString("ru-RU")+" км от Тюмени":""):""),r.seller].filter(Boolean).forEach(t=>meta.append(el("span",{},t)));
  meta.prepend(el("span",{className:"plat"},platform(r.url)));
  meta.append(el("span",{className:isFresh(r)?"fresh":"added"},(isFresh(r)?"● СВЕЖЕЕ · ":"")+fmtAdded(r)));
  if(r.flag)meta.append(el("span",{},"⚠ "+r.flag));
  d.append(meta);
  const row=el("div",{className:"row",role:"group"});row.setAttribute("aria-label","Статус");
  STATUSES.forEach(([k,l])=>{const b=el("button",{className:"st",id:"st-"+r.id+"-"+k,disabled:!canWrite},l);
    b.dataset.s=k;b.setAttribute("aria-pressed",String(r.status===k));b.onclick=()=>save(r.id,{status:k});row.append(b)});
  d.append(row);
  const ta=el("textarea",{id:"c-"+r.id,placeholder:"Комментарий: что ответил продавец, что не так…",value:pending.has(r.id)?pending.get(r.id):(r.comment||""),readOnly:!canWrite});
  ta.setAttribute("aria-label","Комментарий к "+r.title);
  const sv=el("div",{className:"saved",id:"sv-"+r.id,role:"status"});
  let t;ta.oninput=()=>{pending.set(r.id,ta.value);clearTimeout(t);t=setTimeout(()=>commit(r.id,ta.value),900)};
  ta.onblur=()=>{clearTimeout(t);if(pending.has(r.id))commit(r.id,ta.value)};
  d.append(ta,sv);d.append(filesBox(r));return w;
}

async function commit(id,val){const cur=rows.find(r=>r.id===id);if(cur&&(cur.comment||"")===val){pending.delete(id);return}await save(id,{comment:val});pending.delete(id)}

function save(id,patch){
  const prev=writing.get(id)||Promise.resolve();
  const job=prev.then(async()=>{
    let error=null;
    try{await rpc("cars_update",{p_id:id,p_status:patch.status??null,p_comment:patch.comment??null})}catch(e){error=e}
    const sv=document.getElementById("sv-"+id);
    if(error){if(sv)sv.textContent="Не сохранилось, попробуйте ещё раз";return}
    const r=rows.find(x=>x.id===id);if(r)Object.assign(r,patch);
    if("status" in patch)render();else if(sv)sv.textContent="Сохранено";
  });
  writing.set(id,job);return job;
}

function stLabel(s){return s==="drop"?"Архив (отсеяно)":((STATUSES.find(x=>x[0]===s)||[0,s])[1])}
function showCar(id){const r=rows.find(x=>x.id===id);if(!r)return;filter=r.status==="drop"?"drop":"active";Object.assign(F,{model:"",city:"",km:"",price:"",dist:""});addOpen=false;render();const c=document.getElementById("car-"+id);if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("hl");setTimeout(()=>c.classList.remove("hl"),3000)}}
function findDups(id,u,y,p,k){return rows.filter(r=>r.id===id||(u&&r.url===u)||(y&&k&&r.year===y&&Math.abs((r.km||0)-k)<=Math.max(500,k*0.01)&&(!p||!r.price||Math.abs(r.price-p)<=r.price*0.05)))}
function start(){if(creds)load();else showLogin()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&creds&&!document.activeElement?.matches("textarea,input,select"))load()});
start();
</script>
</body>
