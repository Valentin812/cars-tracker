<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Моя выборка</title>
<style>
:root{--bg:#f6f7f5;--fg:#1c2421;--mut:#5d6a64;--card:#fff;--line:#dde3df;--acc:#1f6b4f;--warn:#a85a0c;--warnbg:#fdeede}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:22px;margin:0}.sub{color:var(--mut);margin:0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.t{font-weight:600}.p{font-weight:700;white-space:nowrap}
.m{color:var(--mut);font-size:13px}.c{font-size:13.5px}.ph{width:100%;height:190px;object-fit:cover;border-radius:8px;background:var(--line)}.n{font-size:14px;border-left:3px solid var(--acc);padding-left:9px}.w{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:4px 8px;font-size:12.5px}

<h1>Моя выборка</h1><p class="sub" id="s">Загрузка…</p><div id="o" style="display:flex;flex-direction:column;gap:10px"></div><div id="an" style="display:flex;flex-direction:column;gap:10px"></div></main>
<script>
var U="https://swprtuowqpuwgthigweq.supabase.co",K="sb_publishable_ssarpAvvqN9qsYQE468vjg_mGhppJB_",B=[U,"https://shrill-sun-761c.valentin-tmn.workers.dev"];
var ST={new:"Новое",keep:"Интересно",later:"Посмотреть позже",far:"Далеко",wrote:"Написал",drop:"Не оставляем"};
var f=function(n){return n==null?"—":Number(n).toLocaleString("ru-RU")};
var e=function(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML};
async function go(c){for(var k=0;k<6;k++){var ac=new AbortController(),to=setTimeout(function(){ac.abort()},8000);try{var r=await fetch(B[k%2]+"/rest/v1/rpc/cars_list",{method:"POST",signal:ac.signal,headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({p_login:c.l,p_pass:c.p})});clearTimeout(to);if(r.ok)return r.json();if(r.status<500)throw new Error("auth")}catch(x){clearTimeout(to);if(x.message==="auth")throw x}}throw new Error("net")}
function an(all){
var LIM=function(r){return r.grp==="Китай"?{p:1900000,k:50000}:{p:2300000,k:170000}};
var rest=all.filter(function(r){return !r.pick&&(r.status==="keep"||r.status==="later")});
function why(r){var l=LIM(r),w=[];if(r.price>l.p)w.push("цена выше лимита");if(r.km>l.k)w.push("пробег выше лимита");else if(r.grp==="Корея"&&r.km>130000)w.push("пробег больше 130 тыс. км");if(r.distance>1500)w.push("очень далеко");else if(r.distance>1000)w.push("далеко");return w}
function li(r){var w=why(r);return '<div class="li"><b>'+e(r.title)+(r.year?", "+r.year:"")+'</b> · '+f(r.price)+' ₽ · '+f(r.km)+' км · '+e((r.city||"").split(" (")[0])+(r.distance>0?" · "+f(r.distance)+" км":"")+(w.length?'<div class="r">'+w.join(", ")+'</div>':"")+' <a href="'+e(r.url)+'" target="_blank" rel="noopener">Открыть</a></div>'}
var A=rest.filter(function(r){var w=why(r);return !w.some(function(x){return x!=="далеко"})}).sort(function(a,b){return a.distance-b.distance||a.price-b.price});
var Bd=rest.filter(function(r){return A.indexOf(r)<0}).sort(function(a,b){return a.distance-b.distance||a.price-b.price});
var h='<h2>Анализ остальных ('+rest.length+')</h2><p class="sub">Остальные из «Интересно» и «Посмотреть позже», которых нет в выборке. Разбор на 14.11.2026.</p>';
var nf=rest.filter(function(r){return r.distance>1500}).length;
h+='<div class="card"><h3>Что осталось вне выборки</h3><ul><li>Дальше 1500 км: '+nf+' из '+rest.length+' (Москва, Тверь, Ярославль, Петербург и другие). Без посредника на месте ехать за такими нет смысла.</li><li>Тюмень: Tiggo 8 2022, 1,9 млн, 48 тыс. км, робот. Пробег на пределе лимита, поэтому не вошёл.</li><li>Челябинск: Tiggo 8 Pro 2021, 1,75 млн, 48,9 тыс. км, робот. Тоже на пределе по пробегу.</li><li>Барнаул и Оренбург (1500 км): Tiggo 8 за 1,837 млн (38 тыс. км) и 1,85 млн (28 тыс. км). На границе расстояния, есть ближе и лучше.</li><li>Grand Santa Fe 2014–2015 (Ишимбай, Киров, Новосибирск): дизель 2.2, пробег 162–166 тыс. км. Старые, пробег на пределе.</li><li>Sorento Prime в Барнауле (3.3, 2016, 157 тыс. км, 2,2 млн) и в Казани (2018, 157 тыс. км, 2,28 млн): пробег выше, чем у выбранных корейцев.</li><li>Mazda CX-9 2017 4WD в Набережных Челнах: 157 тыс. км, 2,29 млн. Хуже варианта из Самары.</li></ul></div>';
h+='<div class="card"><h3>Вывод</h3><p style="margin:0">После ваших отсевов из Кореи и Японии в выборке осталось мало: CX-9 в Самаре, Carnival в Казани и Sorento в Барнауле. Более свежие и с малым пробегом варианты идут у китайцев, поэтому они занимают основную часть списка. Остальные машины либо дальше 1500 км, либо выше лимитов, либо старше и с большим пробегом.</p></div>';
h+='<details><summary>Можно рассмотреть ('+A.length+')</summary>'+A.map(li).join("")+'</details>';
h+='<details><summary>Отсеять: выше лимита или очень далеко ('+Bd.length+')</summary>'+Bd.map(li).join("")+'</details>';
document.getElementById("an").innerHTML=h}
(async function(){var s=document.getElementById("s"),c=null;try{c=JSON.parse(localStorage.getItem("cars_creds"))}catch(x){}
if(!c){s.innerHTML='Сначала войдите в <a href="./">таблицу</a>, затем вернитесь сюда.';return}
try{var all=await go(c);var rows=all.filter(function(r){return r.pick}).sort(function(a,b){return (a.pick_rank||99)-(b.pick_rank||99)});
s.textContent="В выборке: "+rows.length+". Порядок по вашим приоритетам: Корея и Япония (Carnival в приоритете), затем китайские гибриды, затем Tiggo 8 с вариатором, затем с роботом, чем меньше пробег, тем выше. Лимиты по цене и пробегу соблюдены, расстояние до 1500 км.";
document.getElementById("o").innerHTML=rows.map(function(r,i){var hd=(i===0||rows[i-1].pick_tier!==r.pick_tier)?'<h2>'+e(r.pick_tier)+'</h2>':'';return hd+'<div class="card">'+(r.photo?'<img class="ph" src="'+e(r.photo)+'" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'<div class="top"><span class="t">№'+r.pick_rank+' '+e(r.title)+(r.year?", "+r.year:"")+'</span><span class="p">'+f(r.price)+' ₽</span></div><div class="m">'+f(r.km)+' км · '+e(r.city)+(r.distance>0?" · "+f(r.distance)+" км от Тюмени":"")+' · '+(ST[r.status]||e(r.status))+'</div>'+(r.pick_note?'<div class="n">'+e(r.pick_note)+'</div>':'')+(r.flag?'<div class="w">⚠ '+e(r.flag)+'</div>':'')+(r.comment?'<div class="c">'+e(r.comment)+'</div>':'')+'<div><a href="'+e(r.url)+'" target="_blank" rel="noopener">Открыть объявление</a></div></div>'}).join("");an(all)}
catch(x){s.textContent=x.message==="auth"?"Нет доступа, войдите в таблицу заново.":"Нет связи, обновите страницу."}})();
</script></body></html>
